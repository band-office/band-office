version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      prisma-runtime:
        patterns:
          - prisma
          - "@prisma/*"
      next-runtime:
        patterns:
          - next
          - eslint-config-next
    ignore:
      - dependency-name: better-sqlite3
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
