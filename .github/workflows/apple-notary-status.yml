name: Check Apple notarization status

on:
  workflow_dispatch:
    inputs:
      submission_ids:
        description: One Apple notarization submission ID per line
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-status:
    runs-on: macos-14
    timeout-minutes: 10
    env:
      SUBMISSION_IDS: ${{ inputs.submission_ids }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
    steps:
      - name: Materialize notarization credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_NOTARY_KEY_P8_BASE64"
          notary_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$notary_key"
          chmod 600 "$notary_key"
          echo "APPLE_API_KEY=$notary_key" >> "$GITHUB_ENV"
      - name: Query existing Apple submissions
        shell: bash
        run: |
          set -euo pipefail
          echo "# Apple notarization status" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r submission_id || [ -n "$submission_id" ]; do
            submission_id="${submission_id//$'\r'/}"
            [ -z "$submission_id" ] && continue
            if [[ ! "$submission_id" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
              echo "Invalid Apple notarization submission ID: $submission_id" >&2
              exit 1
            fi

            response="$RUNNER_TEMP/notarization-${submission_id}.json"
            xcrun notarytool info "$submission_id" \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --output-format json > "$response"
            status="$(plutil -extract status raw -o - "$response")"
            summary="$(plutil -extract statusSummary raw -o - "$response" 2>/dev/null || true)"
            printf '%s: %s%s\n' "$submission_id" "$status" "${summary:+ - $summary}"
            printf '%s\n' "- \`$submission_id\`: **$status**${summary:+ - $summary}" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$SUBMISSION_IDS"
