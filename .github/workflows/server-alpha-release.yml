name: Band Office Server alpha release

on:
  push:
    tags:
      - "v*-server-alpha.*"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/band-office/band-office-server

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: git fetch --no-tags origin main:refs/remotes/origin/main
      - run: npm ci
      - run: npm run release:server:tag:verify
      - run: npm run server:verify
      - run: npx playwright install --with-deps chromium
      - run: npm run release:verify

  container-acceptance:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build native acceptance image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: band-office-server:acceptance
          build-args: |
            BAND_OFFICE_VERSION=0.1.0
            BAND_OFFICE_REVISION=${{ github.sha }}
      - run: npm run server:container:test -- band-office-server:acceptance
      - run: npm run server:compose:test -- band-office-server:acceptance
      - name: Block fixed high or critical container vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: band-office-server:acceptance
          fail-build: true
          only-fixed: true
          output-format: table
          severity-cutoff: high

  publish-prerelease:
    needs: container-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: server-alpha-release
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: git fetch --no-tags origin main:refs/remotes/origin/main
      - run: npm ci
      - run: npm run release:server:tag:verify
      - name: Resolve release identity
        id: release
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish multi-platform Server image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            BAND_OFFICE_VERSION=${{ steps.release.outputs.version }}
            BAND_OFFICE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
      - name: Sign and publish GitHub build provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Verify image index and signed provenance
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}@${{ steps.image.outputs.digest }}" | tee image-index.txt
          grep -q "linux/amd64" image-index.txt
          grep -q "linux/arm64" image-index.txt
          gh attestation verify "oci://${IMAGE_NAME}@${{ steps.image.outputs.digest }}" --repo "$GITHUB_REPOSITORY"
          anonymous_config="$(mktemp -d)"
          DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect "${IMAGE_NAME}@${{ steps.image.outputs.digest }}"
      - name: Build and verify digest-pinned operator bundle
        run: |
          npm run server:bundle -- --image "${IMAGE_NAME}@${{ steps.image.outputs.digest }}"
          npm run release:server:artifact:verify -- dist-server
      - name: Write source-bound Server release manifest
        env:
          BAND_OFFICE_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          BAND_OFFICE_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: npm run release:server:manifest -- dist-server
      - name: Sign operator bundle provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: dist-server/Band-Office-Server-0.1.0.zip
      - name: Publish durable Server alpha prerelease
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist-server/Band-Office-Server-0.1.0.zip \
            dist-server/SHA256SUMS.txt \
            dist-server/Band-Office-Server-RELEASE-MANIFEST.json \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --verify-tag \
            --title "Band Office Server ${GITHUB_REF_NAME#v}" \
            --notes-file .github/server-alpha-release-notes.md
