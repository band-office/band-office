name: Band Office release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-beta*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:verify

  macos-unsigned-acceptance:
    needs: quality
    name: macos-${{ matrix.arch }}-unsigned-acceptance
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            executable_arch: arm64
            package_script: desktop:dist:mac:arm64
          - arch: x64
            runner: macos-15-intel
            executable_arch: x86_64
            package_script: desktop:dist:mac:x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.package_script }}
      - run: npm run test:desktop-package
      - run: npm run release:desktop:verify
      - name: Verify architecture and unsigned distribution boundary
        run: |
          app="$(find dist-desktop -maxdepth 3 -type d -name 'Band Office.app' | head -n 1)"
          test -n "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Band Office")" = "${{ matrix.executable_arch }}"
          if codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'Authority=Developer ID Application'; then
            echo "Unexpected Developer ID signature on the unsigned macOS release candidate." >&2
            exit 1
          fi
      - name: Verify disk image
        run: hdiutil verify dist-desktop/Band-Office-*-mac-${{ matrix.arch }}.dmg
      - name: Write checksums
        working-directory: dist-desktop
        run: shasum -a 256 Band-Office-*-mac-${{ matrix.arch }}.dmg Band-Office-*-mac-${{ matrix.arch }}.zip > SHA256SUMS-macos-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-macos-${{ matrix.arch }}-test-artifacts
          path: |
            dist-desktop/Band-Office-*-mac-${{ matrix.arch }}.dmg
            dist-desktop/Band-Office-*-mac-${{ matrix.arch }}.zip
            dist-desktop/SHA256SUMS-macos-${{ matrix.arch }}.txt

  windows-unsigned-acceptance:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:dist:win
      - run: npm run test:desktop-package
      - run: npm run release:desktop:verify
      - name: Verify unsigned distribution boundary
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist-desktop/Band-Office-*-win-x64.exe" | Select-Object -First 1
          $application = Get-Item "dist-desktop/win-unpacked/Band Office.exe"
          foreach ($file in @($installer, $application)) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -eq "Valid") {
              throw "Unexpected Authenticode signature on the unsigned Windows release candidate: $($file.FullName)"
            }
          }
      - name: Write checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist-desktop/Band-Office-*-win-*.exe, dist-desktop/Band-Office-*-win-*.zip |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" }
          [System.IO.File]::WriteAllText(
            "dist-desktop/SHA256SUMS-windows.txt",
            (($lines -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-test-artifacts
          path: |
            dist-desktop/Band-Office-*-win-*.exe
            dist-desktop/Band-Office-*-win-*.zip
            dist-desktop/SHA256SUMS-windows.txt
