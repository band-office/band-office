name: Band Office Desktop alpha release

on:
  push:
    tags:
      - "v*-alpha.*"
      - "!v*-server-alpha.*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: git fetch --no-tags origin main:refs/remotes/origin/main
      - run: npm ci
      - run: npm run release:tag:verify
      - run: npx playwright install --with-deps chromium
      - run: npm run release:verify

  adhoc-macos:
    needs: quality
    name: adhoc-macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            executable_arch: arm64
            package_script: desktop:dist:mac:arm64
          - arch: x64
            runner: macos-15-intel
            executable_arch: x86_64
            package_script: desktop:dist:mac:x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.package_script }}
      - run: npm run test:desktop-package
      - run: npm run release:desktop:verify
      - name: Verify architecture, integrity seal, distribution boundary, and disk image
        run: |
          app="$(find dist-desktop -maxdepth 3 -type d -name 'Band Office.app' | head -n 1)"
          dmg="$(find dist-desktop -name 'Band-Office-*-mac-${{ matrix.arch }}.dmg' -type f | head -n 1)"
          test -n "$app"
          test -n "$dmg"
          test "$(lipo -archs "$app/Contents/MacOS/Band Office")" = "${{ matrix.executable_arch }}"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'Signature=adhoc'
          if codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'Authority=Developer ID Application'; then
            echo "Unexpected Developer ID signature on the ad hoc macOS release." >&2
            exit 1
          fi
          hdiutil verify "$dmg"
      - name: Write macOS checksums
        working-directory: dist-desktop
        run: shasum -a 256 Band-Office-*-mac-${{ matrix.arch }}.dmg Band-Office-*-mac-${{ matrix.arch }}.zip > SHA256SUMS-macos-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adhoc-macos-${{ matrix.arch }}-alpha
          retention-days: 30
          path: |
            dist-desktop/Band-Office-*-mac-${{ matrix.arch }}.dmg
            dist-desktop/Band-Office-*-mac-${{ matrix.arch }}.zip
            dist-desktop/SHA256SUMS-macos-${{ matrix.arch }}.txt

  unsigned-windows:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:dist:win
      - run: npm run test:desktop-package
      - run: npm run release:desktop:verify
      - name: Verify unsigned distribution boundary
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist-desktop/Band-Office-*-win-x64.exe" | Select-Object -First 1
          $application = Get-Item "dist-desktop/win-unpacked/Band Office.exe"
          foreach ($file in @($installer, $application)) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -eq "Valid") {
              throw "Unexpected Authenticode signature on the unsigned Windows release: $($file.FullName)"
            }
          }
      - name: Write Windows checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist-desktop/Band-Office-*-win-x64.exe, dist-desktop/Band-Office-*-win-x64.zip |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" }
          [System.IO.File]::WriteAllText(
            "dist-desktop/SHA256SUMS-windows.txt",
            (($lines -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-alpha
          retention-days: 30
          path: |
            dist-desktop/Band-Office-*-win-x64.exe
            dist-desktop/Band-Office-*-win-x64.zip
            dist-desktop/SHA256SUMS-windows.txt

  publish-prerelease:
    needs:
      - adhoc-macos
      - unsigned-windows
    runs-on: ubuntu-latest
    environment: desktop-alpha-release
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: git fetch --no-tags origin main:refs/remotes/origin/main
      - run: npm run release:tag:verify
      - name: Download platform artifacts
        run: gh run download "$GITHUB_RUN_ID" --dir release-assets
      - run: npm run release:manifest -- release-assets
      - name: Publish durable Desktop alpha prerelease
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/adhoc-macos-*-alpha/* \
            release-assets/unsigned-windows-alpha/* \
            release-assets/Band-Office-RELEASE-MANIFEST.json \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --verify-tag \
            --title "Band Office Desktop ${GITHUB_REF_NAME#v}" \
            --notes-file .github/desktop-alpha-release-notes.md
