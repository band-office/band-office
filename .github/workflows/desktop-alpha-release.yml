name: Band Office Desktop alpha preparation

on:
  push:
    tags:
      - "v*-alpha.*"
      - "!v*-server-alpha.*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: git fetch --no-tags origin main:refs/remotes/origin/main
      - run: npm ci
      - run: npm run release:tag:verify
      - run: npx playwright install --with-deps chromium
      - run: npm run release:verify

  signed-macos:
    needs: quality
    name: signed-macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            executable_arch: arm64
            package_script: desktop:dist:mac:arm64:sign-only
          - arch: x64
            runner: macos-15-intel
            executable_arch: x86_64
            package_script: desktop:dist:mac:x64:sign-only
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_LINK: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Materialize notarization credential
        shell: bash
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_NOTARY_KEY_P8_BASE64"
          notary_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$notary_key"
          chmod 600 "$notary_key"
          echo "APPLE_API_KEY=$notary_key" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run ${{ matrix.package_script }}
      - run: npm run test:desktop-package
      - run: npm run release:desktop:verify
      - name: Verify architecture and Developer ID signature
        run: |
          app="$(find dist-desktop -maxdepth 3 -type d -name 'Band Office.app' | head -n 1)"
          test -n "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Band Office")" = "${{ matrix.executable_arch }}"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'Authority=Developer ID Application'
          if codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'Signature=adhoc'; then
            echo "Ad hoc signing is not allowed for the notarized macOS release." >&2
            exit 1
          fi
      - name: Submit exact signed application for Apple notarization
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p \"require('./package.json').version\")"
          app="$(find dist-desktop -maxdepth 3 -type d -name 'Band Office.app' | head -n 1)"
          test -n "$app"
          mkdir -p pending-notarization
          archive_name="Band-Office-${version}-mac-${{ matrix.arch }}-pending-notarization.zip"
          archive="pending-notarization/$archive_name"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          xcrun notarytool submit "$archive" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json > pending-notarization/notarytool-response.json
          sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          node scripts/write-notarization-submission.mjs \
            --output pending-notarization/notarization-submission.json \
            --response pending-notarization/notarytool-response.json \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --arch "${{ matrix.arch }}" \
            --archive "$archive_name" \
            --sha256 "$sha256"
          rm pending-notarization/notarytool-response.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pending-notarization-macos-${{ matrix.arch }}-alpha
          retention-days: 90
          path: pending-notarization/

  unsigned-windows:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:dist:win
      - run: npm run test:desktop-package
      - run: npm run release:desktop:verify
      - name: Verify unsigned distribution boundary
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist-desktop/Band-Office-*-win-x64.exe" | Select-Object -First 1
          $application = Get-Item "dist-desktop/win-unpacked/Band Office.exe"
          foreach ($file in @($installer, $application)) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -eq "Valid") {
              throw "Unexpected Authenticode signature on the unsigned Windows release: $($file.FullName)"
            }
          }
      - name: Write Windows checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist-desktop/Band-Office-*-win-x64.exe, dist-desktop/Band-Office-*-win-x64.zip |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" }
          [System.IO.File]::WriteAllText(
            "dist-desktop/SHA256SUMS-windows.txt",
            (($lines -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-alpha
          retention-days: 30
          path: |
            dist-desktop/Band-Office-*-win-x64.exe
            dist-desktop/Band-Office-*-win-x64.zip
            dist-desktop/SHA256SUMS-windows.txt
